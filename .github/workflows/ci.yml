name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Format, provenance, generation and coverage
        run: go run ./cmd/check
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Build
        run: go build ./...
